<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef3ed">
  <title>On This Site - Offline Archive</title>
  <link rel="stylesheet" href="assets/css/mobile-app.css">
  <style>
    :root{--water:#b9dce7;--soft:#e5efe9;--native-top-safe:0px;--native-right-safe:0px;--native-bottom-safe:0px;--native-left-safe:0px;--app-top-safe:max(env(safe-area-inset-top),var(--native-top-safe));--app-right-safe:max(env(safe-area-inset-right),var(--native-right-safe));--app-bottom-safe:max(env(safe-area-inset-bottom),var(--native-bottom-safe));--app-left-safe:max(env(safe-area-inset-left),var(--native-left-safe))}
    html,body{height:100%;min-height:100%;overflow:hidden}.offline-shell{grid-template-rows:auto var(--map-height) auto minmax(0,1fr);padding-bottom:var(--app-bottom-safe);padding-left:var(--app-left-safe);padding-right:var(--app-right-safe)}
    .offline-shell header{padding-top:max(12px,var(--app-top-safe))}.offline-pill{min-width:88px;max-width:none;border-color:var(--accent-strong);background:#edf4ef;color:var(--accent-strong);font-size:12px;font-weight:850;pointer-events:none}.offline-shell .mobile-header-instruction{padding:0;border:0;background:transparent}.offline-shell .quick-actions{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto auto}
    .offline-shell .mobile-layer-panel,.offline-shell .mobile-more-grid{top:calc(var(--app-top-safe) + 198px)}.offline-shell .mobile-more-grid{left:max(8px,var(--app-left-safe));right:max(8px,var(--app-right-safe));width:auto}.offline-shell .regions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.offline-shell .regions button{min-height:44px;padding:7px;border:1px solid #bdc9bf;border-radius:8px;background:#fff;color:var(--accent-strong);font-size:12px;font-weight:850}.offline-shell .regions button[aria-pressed=true]{border-color:var(--accent);background:var(--accent);color:#fff}
    .offline-map-index{position:relative;display:block;min-height:0;padding:0;overflow:hidden;background:var(--water);color:var(--ink);text-align:left}.offline-map-head{position:absolute;top:10px;left:10px;right:10px;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none}.offline-map-head strong,.offline-map-head .status{padding:6px 8px;border:1px solid rgba(23,33,25,.16);border-radius:7px;background:rgba(251,252,250,.94);box-shadow:0 2px 7px rgba(24,39,30,.16)}#map{position:absolute;inset:0;min-height:0;background:var(--water)}#offline-map{display:block;width:100%;height:100%;touch-action:manipulation}.map-help{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);margin:0;padding:6px 8px;border:1px solid rgba(23,33,25,.18);border-radius:7px;background:rgba(251,252,250,.94);color:#475248;font-size:12px;pointer-events:none}
    .offline-shell .mobile-view-tabs{position:relative}.offline-shell .list-panel{display:block;min-height:0;overflow:hidden}.offline-shell .site-list{height:calc(100% - 49px);padding-bottom:max(24px,var(--app-bottom-safe))}.offline-shell .learning-card{display:block}.offline-shell .learning-card-body{gap:7px}.offline-shell .learning-card h2 button{touch-action:manipulation}.offline-shell .learning-card-actions{grid-template-columns:1fr}.offline-shell .learning-card-actions button{min-height:42px}.offline-shell #load-more{width:calc(100% - 20px);min-height:44px;margin:0 10px 18px;border:1px solid #bdc9bf;border-radius:8px;background:#fff;color:var(--accent-strong);font-weight:850}.offline-shell #load-more[hidden]{display:none}.offline-shell .site-list:has(+ #load-more:not([hidden])){height:calc(100% - 103px)}
    .detail{position:fixed;inset:var(--app-top-safe) var(--app-right-safe) var(--app-bottom-safe) var(--app-left-safe);z-index:2000;display:grid;align-items:end;background:rgba(13,22,17,.38);transform:none;opacity:1;pointer-events:auto}.detail[hidden]{display:none}.detail-card{width:100%;max-height:100%;overflow:auto;padding:20px 20px 26px;border-radius:16px 16px 0 0;background:#fff;box-shadow:0 -10px 30px rgba(13,22,17,.18)}.detail-head{display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:12px;align-items:start;margin-bottom:18px}.detail h2{margin:0;font-size:24px;line-height:1.14}.detail-close{width:48px;height:48px;border:1px solid #bdc9bf;border-radius:8px;background:#fff;color:var(--ink);font-size:18px}.detail-meta{margin:5px 0 0;color:var(--muted);font-size:14px}.detail-body{display:grid;gap:15px;font-size:16px;line-height:1.55}.detail-body h3,.detail-body p{margin:0}.offline-only{padding:10px 12px;border-left:4px solid var(--accent);background:var(--soft);color:#35473d;font-size:14px}
    @media(max-height:700px){.offline-shell{--map-height:34vh}.offline-shell .mobile-layer-panel,.offline-shell .mobile-more-grid{top:calc(var(--app-top-safe) + 177px)}}
  </style>
</head>
<body class="offline-text-mode native-android-app android-device">
  <main class="app panel-nearby offline-shell">
    <header>
      <div class="title-row"><h1>On This Site</h1><span class="title-actions"><span class="ghost-button account-button offline-pill">Offline</span></span></div>
      <div class="search-autocomplete"><input class="search" id="search" type="search" autocomplete="off" enterkeyhint="search" placeholder="Search sites, towns, histories" aria-label="Search saved places and histories"></div>
      <p class="mobile-header-instruction" id="offline-summary">Opening the saved offline archive...</p>
      <div class="quick-actions" aria-label="Offline app actions">
        <button class="ghost-button mobile-priority-action" id="offline-about" type="button">About</button>
        <button class="ghost-button mobile-priority-action" id="offline-feedback" type="button">Feedback</button>
        <details class="mobile-layer-menu" id="offline-region-menu">
          <summary>Areas</summary>
          <div class="mobile-layer-panel" role="group" aria-label="Saved areas">
            <div class="regions">
              <button type="button" data-offline-region="all" aria-pressed="true">All areas</button>
              <button type="button" data-offline-region="west" aria-pressed="false">Western</button>
              <button type="button" data-offline-region="central" aria-pressed="false">Central</button>
              <button type="button" data-offline-region="east" aria-pressed="false">East End</button>
            </div>
          </div>
        </details>
        <details class="mobile-more-menu" id="offline-menu">
          <summary>Menu</summary>
          <div class="mobile-more-grid">
            <button class="ghost-button" type="button" data-offline-jump="map">Map</button>
            <button class="ghost-button" type="button" data-offline-jump="archive">Saved places</button>
            <button class="ghost-button" id="offline-menu-about" type="button">About</button>
            <button class="ghost-button" id="offline-menu-help" type="button">Offline help</button>
          </div>
        </details>
      </div>
    </header>
    <section class="mobile-map-shell offline-map-index" id="offline-map-section" aria-label="Offline place map">
      <div class="offline-map-head"><strong>Saved map</strong><span class="status" id="status" role="status">Loading saved places...</span></div>
      <div id="map" aria-label="Simplified offline map of saved places"><canvas id="offline-map"></canvas><p class="map-help">Tap a dot to open its saved article.</p></div>
    </section>
    <div class="mobile-view-tabs" role="group" aria-label="Offline section">
      <button class="mobile-view-tab" id="offline-tab-map" type="button" data-offline-jump="map" aria-pressed="false">Map</button>
      <button class="mobile-view-tab" id="offline-tab-saved" type="button" data-offline-jump="archive" aria-pressed="true">Saved places</button>
      <button class="mobile-view-tab mobile-panel-hide" id="offline-collapse" type="button" aria-label="Collapse saved places">Collapse</button>
      <button class="mobile-view-tab mobile-panel-size" id="offline-full" type="button" aria-label="Open full-screen saved places" aria-expanded="false">Full</button>
    </div>
    <section class="list-panel archive" id="offline-archive-section" aria-label="Saved text archive">
      <div class="list-head"><span class="list-title"><strong>Saved places and articles</strong></span><span class="status" id="result-count"></span></div>
      <div class="site-list" id="site-list"><article class="site-card empty-state" role="status"><span class="site-copy"><h2>Loading the saved archive...</h2><p>No internet connection is required.</p></span></article></div>
      <button id="load-more" type="button" hidden>Show more</button>
    </section>
  </main>
  <section class="detail" id="detail" hidden aria-modal="true" role="dialog" aria-labelledby="detail-title">
    <article class="detail-card"><div class="detail-head"><div><h2 id="detail-title"></h2><p class="detail-meta" id="detail-meta"></p></div><button class="detail-close" type="button" aria-label="Close saved article">x</button></div><div class="detail-body" id="detail-body"></div></article>
  </section>
  <script>
  (() => {
    const bridgeInset=name=>{try{return Math.max(0,Number(window.AndroidApp?.[name]?.())||0)}catch{return 0}};
    const syncNativeInsets=()=>{const insets={top:bridgeInset("getSafeInsetTop"),right:bridgeInset("getSafeInsetRight"),bottom:bridgeInset("getSafeInsetBottom"),left:bridgeInset("getSafeInsetLeft")};for(const [side,value] of Object.entries(insets)){document.documentElement.style.setProperty(`--native-${side}-safe`,`${Math.ceil(value)}px`)}};
    syncNativeInsets();addEventListener("nli-native-insets-changed",syncNativeInsets);
    const PATHS=["assets/data/mobile-site-index.json","assets/data/mobile-site-geometry.json","assets/data/mobile-wiki-index.json"];
    const LIMIT=40, B={west:-74.28,east:-71.82,south:40.48,north:41.34}, S={west:-73.42,east:-72.72};
    const state={sites:[],wikis:[],filtered:[],visible:LIMIT,region:"all",query:"",points:[]};
    const $=id=>document.getElementById(id), app=document.querySelector(".offline-shell"), search=$("search"), list=$("site-list"), status=$("status"), count=$("result-count"), summary=$("offline-summary"), more=$("load-more"), canvas=$("offline-map"), detail=$("detail"), title=$("detail-title"), meta=$("detail-meta"), body=$("detail-body"), mapTab=$("offline-tab-map"), savedTab=$("offline-tab-saved"), collapse=$("offline-collapse"), full=$("offline-full");
    const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
    const text=v=>{const d=document.createElement("div");d.innerHTML=String(v||"");return String(d.textContent||"").replace(/\s+/g," ").trim()};
    const searchKey=v=>text(v).normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/['\u2018\u2019\u02bc]/gi,"").replace(/[^a-z0-9]+/gi," ").trim().toLocaleLowerCase();
    const rows=p=>Array.isArray(p)?p:(Array.isArray(p?.rows)?p.rows:[]);
    const region=lon=>!Number.isFinite(lon)?"all":lon<=S.west?"west":lon>=S.east?"east":"central";
    const load=async path=>{const r=await fetch(path,{cache:"no-store"});if(!r.ok)throw Error("Saved archive file could not be opened.");return r.json()};
    const pos=(lon,lat,w,h)=>[((lon-B.west)/(B.east-B.west))*w,h-((lat-B.south)/(B.north-B.south))*h];
    function draw(){
      const ratio=Math.min(2,devicePixelRatio||1),w=Math.max(300,canvas.clientWidth),h=Math.max(220,canvas.clientHeight);
      canvas.width=Math.round(w*ratio);canvas.height=Math.round(h*ratio);const c=canvas.getContext("2d");c.setTransform(ratio,0,0,ratio,0,0);c.clearRect(0,0,w,h);
      const outline=[[-74.08,40.58],[-73.9,40.62],[-73.68,40.66],[-73.48,40.72],[-73.22,40.74],[-72.98,40.77],[-72.75,40.82],[-72.5,40.86],[-72.31,40.91],[-72.12,41.01],[-71.88,41.06],[-71.86,41.01],[-72.05,40.96],[-72.22,40.88],[-72.47,40.76],[-72.73,40.68],[-73,40.61],[-73.28,40.59],[-73.55,40.57],[-73.8,40.55]];
      c.beginPath();outline.forEach(([lon,lat],i)=>{const [x,y]=pos(lon,lat,w,h);i?c.lineTo(x,y):c.moveTo(x,y)});c.closePath();c.fillStyle="#ecf0d8";c.strokeStyle="#557260";c.lineWidth=1.4;c.fill();c.stroke();
      state.points=state.filtered.filter(x=>x.kind==="site"&&Number.isFinite(x.longitude)&&Number.isFinite(x.latitude)).map(item=>{const [x,y]=pos(item.longitude,item.latitude,w,h);c.beginPath();c.arc(x,y,2.6,0,Math.PI*2);c.fillStyle="#2f6f57";c.fill();return{item,x,y}});
    }
    function filter(){
      const q=searchKey(state.query);
      state.filtered=[...state.sites.map(x=>({...x,kind:"site"})),...state.wikis.map(x=>({...x,kind:"wiki"}))]
        .filter(x=>state.region==="all"||x.kind==="wiki"||x.region===state.region)
        .filter(x=>!q||searchKey(`${x.title||""} ${x.summary||""} ${x.address_label||""} ${x.why_this_matters||""}`).includes(q))
        .sort((a,b)=>{if(q){const rank=x=>{const titleKey=searchKey(x.title||"");if(titleKey===q)return 0;if(titleKey.startsWith(`${q} `)||titleKey.startsWith(q))return 1;if(titleKey.includes(` ${q}`)||titleKey.includes(q))return 2;return 3},delta=rank(a)-rank(b);if(delta)return delta}return String(a.title||"").localeCompare(String(b.title||""))});
    }
    function render(){
      filter();const visible=state.filtered.slice(0,state.visible);
      list.innerHTML=visible.length?visible.map((x,i)=>{
        const source=x.kind==="wiki"?"Knowledgebase article":(x.site_type||"Mapped place"),location=x.kind==="wiki"?"Saved history":(x.address_label||"Saved map entry"),excerpt=text(x.summary||"").slice(0,260);
        return `<article class="site-card learning-card nearby-feed-card" ${x.kind==="wiki"?`data-wiki-slug="${esc(x.slug||"")}"`:`data-slug="${esc(x.slug||"")}"`} data-result-index="${i}"><div class="learning-card-body"><div class="learning-card-meta"><span>${esc(source)}</span><strong>Offline</strong></div><h2><button type="button" data-result-open="${i}">${esc(x.title||"Untitled")}</button></h2><div class="learning-card-tags"><span>${esc(location)}</span></div>${excerpt?`<p class="learning-card-excerpt">${esc(excerpt)}</p>`:""}<div class="learning-card-actions"><button class="primary" type="button" data-result-open="${i}">Open saved article</button></div></div></article>`
      }).join(""):`<article class="site-card empty-state" role="status"><span class="site-copy"><h2>No saved result found</h2><p>Try a different word or area.</p></span></article>`;
      count.textContent=`${state.filtered.length} saved`;status.textContent=state.region==="all"?`${state.sites.length} mapped places`:`${state.filtered.filter(x=>x.kind==="site").length} in this area`;more.hidden=visible.length>=state.filtered.length;more.textContent=`Show more (${state.filtered.length-visible.length} remaining)`;draw();
    }
    function openDetail(detailTitle,detailMeta,detailHtml){title.textContent=detailTitle;meta.textContent=detailMeta;body.innerHTML=detailHtml;detail.hidden=false;detail.classList.add("open");detail.querySelector(".detail-card").scrollTop=0}
    function open(item){
      if(!item)return;const intro=text(item.summary||""),why=text(item.why_this_matters||"");openDetail(item.title||"Saved article",item.kind==="wiki"?"Knowledgebase article":(item.address_label||item.site_type||"Mapped place"),`${intro?`<p>${esc(intro)}</p>`:"<p>No summary was saved for this entry.</p>"}${why?`<h3>Why this matters</h3><p>${esc(why)}</p>`:""}<p class="offline-only">This saved version remains available without a connection. Images, comments, accounts, submissions, and current updates return when the app reconnects.</p>`);
    }
    function showMap(){app.classList.remove("panel-maximized");app.classList.add("panel-collapsed");mapTab.setAttribute("aria-pressed","true");savedTab.setAttribute("aria-pressed","false");collapse.textContent="Open";full.textContent="Full";full.setAttribute("aria-expanded","false");setTimeout(draw,60)}
    function showArchive({maximize=false,focusSearch=false}={}){app.classList.remove("panel-collapsed");app.classList.toggle("panel-maximized",maximize);mapTab.setAttribute("aria-pressed","false");savedTab.setAttribute("aria-pressed","true");collapse.textContent="Collapse";full.textContent=maximize?"Restore":"Full";full.setAttribute("aria-expanded",maximize?"true":"false");if(focusSearch)setTimeout(()=>search.focus({preventScroll:true}),80);setTimeout(draw,60)}
    async function start(){
      try{
        const [sitePayload,geoPayload,wikiPayload]=await Promise.all(PATHS.map(load)),geo=new Map(rows(geoPayload).map(x=>[String(x.id),x]));
        state.sites=rows(sitePayload).map(x=>{const g=geo.get(String(x.id)),lon=Number(g?.center?.[0]),lat=Number(g?.center?.[1]);return{...x,longitude:Number.isFinite(lon)?lon:null,latitude:Number.isFinite(lat)?lat:null,region:region(lon)}});
        state.wikis=rows(wikiPayload);summary.textContent=`Offline archive: ${state.sites.length} listings and ${state.wikis.length} wiki articles saved. Tap a pin or search below.`;render();
      }catch(error){summary.textContent="The saved archive could not be opened. Reconnect and reopen the app to refresh its offline copy.";status.textContent="Offline archive unavailable";list.innerHTML=`<article class="site-card empty-state" role="status"><span class="site-copy"><h2>Saved content could not load</h2><p>${esc(error?.message||"Unknown offline error")}</p></span></article>`}
    }
    search.addEventListener("input",()=>{state.query=search.value.trim();state.visible=LIMIT;showArchive();render()});search.addEventListener("search",()=>{state.query=search.value.trim();state.visible=LIMIT;showArchive({maximize:true});render()});
    document.querySelectorAll("[data-offline-jump]").forEach(button=>button.addEventListener("click",()=>{
      button.dataset.offlineJump==="map"?showMap():showArchive({focusSearch:button.closest("#offline-menu")!==null});button.closest("details")?.removeAttribute("open");
    }));
    document.querySelectorAll("[data-offline-region]").forEach(b=>b.addEventListener("click",()=>{state.region=b.dataset.offlineRegion||"all";state.visible=LIMIT;document.querySelectorAll("[data-offline-region]").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));$("offline-region-menu").removeAttribute("open");showArchive();render()}));
    list.addEventListener("click",e=>{const b=e.target.closest("[data-result-index]");if(b)open(state.filtered[Number(b.dataset.resultIndex)])});
    more.addEventListener("click",()=>{state.visible+=LIMIT;render()});
    canvas.addEventListener("click",e=>{const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,n=state.points.map(p=>({...p,d:Math.hypot(p.x-x,p.y-y)})).sort((a,b)=>a.d-b.d)[0];if(n&&n.d<=22)open(n.item)});
    collapse.addEventListener("click",()=>app.classList.contains("panel-collapsed")?showArchive():showMap());full.addEventListener("click",()=>showArchive({maximize:!app.classList.contains("panel-maximized")}));
    $("offline-about").addEventListener("click",()=>openDetail("About On This Site","Native Long Island",'<p>On This Site is a map-based archive for learning about Native Long Island places, histories, and continuing community presence.</p><p class="offline-only">You are viewing the saved offline archive.</p>'));$("offline-menu-about").addEventListener("click",()=>{$("offline-menu").removeAttribute("open");$("offline-about").click()});
    $("offline-feedback").addEventListener("click",()=>openDetail("Feedback","Connection required",'<p>Feedback, comments, site suggestions, and contributions will be available after the app reconnects.</p><p class="offline-only">Your saved map and articles remain available now.</p>'));$("offline-menu-help").addEventListener("click",()=>{$("offline-menu").removeAttribute("open");$("offline-feedback").click()});
    document.querySelectorAll(".quick-actions details").forEach(menu=>menu.addEventListener("toggle",()=>{if(menu.open)document.querySelectorAll(".quick-actions details").forEach(other=>{if(other!==menu)other.removeAttribute("open")})}));
    const closeDetail=()=>{detail.classList.remove("open");detail.hidden=true};detail.querySelector(".detail-close").addEventListener("click",closeDetail);detail.addEventListener("click",e=>{if(e.target===detail)closeDetail()});addEventListener("resize",draw,{passive:true});
    window.onAndroidBackPressed=()=>{const menu=document.querySelector(".mobile-more-menu[open]");if(menu){menu.removeAttribute("open");return true}const areas=document.querySelector(".mobile-layer-menu[open]");if(areas){areas.removeAttribute("open");return true}if(!detail.hidden){closeDetail();return true}if(!app.classList.contains("panel-collapsed")){showMap();return true}return false};
    window.NLI_APK_OFFLINE_TEXT_MODE=true;start();
  })();
  </script>
</body>
</html>

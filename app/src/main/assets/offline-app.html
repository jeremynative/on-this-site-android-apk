  <main class="app panel-nearby offline-shell">

              <button type="button" data-offline-region="west" aria-pressed="false">Western</button>
              <button type="button" data-offline-region="central" aria-pressed="false">Central</button>
              <button type="button" data-offline-region="east" aria-pressed="false">East End</button>

          </div>
        </details>
        <details class="mobile-more-menu" id="offline-menu">

            <button class="ghost-button" type="button" data-offline-jump="archive">Saved places</button>
            <button class="ghost-button" id="offline-menu-about" type="button">About</button>
            <button class="ghost-button" id="offline-menu-help" type="button">Offline help</button>
          </div>
        </details>
      </div>
    </header>
    <section class="mobile-map-shell offline-map-index" id="offline-map-section" aria-label="Offline place map">

    </section>
    <div class="mobile-view-tabs" role="group" aria-label="Offline section">

      <button class="mobile-view-tab" id="offline-tab-saved" type="button" data-offline-jump="archive" aria-pressed="true">Saved places</button>
      <button class="mobile-view-tab mobile-panel-hide" id="offline-collapse" type="button" aria-label="Collapse saved places">Collapse</button>

    </div>

      <button id="load-more" type="button" hidden>Show more</button>
    </section>
  </main>

        me={lon:p.coords.longitude,lat:p.coords.latitude,acc:p.coords.accuracy||30};locate.removeAttribute("aria-busy");

        if(meCenter){meCenter=false;if(inside){centerOnMe();status.textContent=`You are here (about ${Math.round(me.acc*3.281)} ft)`}else status.textContent="You are outside the Long Island map."}
        requestAnimationFrame(draw)
      },e=>{locate.removeAttribute("aria-busy");meCenter=false;navigator.geolocation.clearWatch(meWatch);meWatch=null;status.textContent=e.code===1?"Location permission is off for On This Site.":"Could not get a GPS fix. Try near a window or outside."},{enableHighAccuracy:true,maximumAge:60000,timeout:60000});
    });
    function filter(){
      state.filtered=OFFLINE.filterArchive(state.entries,{query:state.query,region:state.region,cache:state.queryCache,cacheLimit:OFFLINE_QUERY_CACHE_LIMIT,searchUtils:SEARCH});
    }
    function hideSuggestions(){suggestions.hidden=true;suggestions.replaceChildren();search.setAttribute("aria-expanded","false")}
    function renderSuggestions(){
      const query=SEARCH.queryModel(state.query);if(document.activeElement!==search||!query.normalized)return hideSuggestions();
      const items=state.filtered.slice(0,5);if(!items.length)return hideSuggestions();
      suggestions.innerHTML=items.map((item,index)=>`<button class="search-suggestion" type="button" role="option" data-offline-search-suggestion="${index}"><strong>${esc(item.title||"Untitled")}</strong><span>${esc(item.kind==="wiki"?"Knowledgebase":typeLabel(item.site_type))}</span></button>`).join("");suggestions.hidden=false;search.setAttribute("aria-expanded","true");
    }
    function render(){
      filter();const visible=state.filtered.slice(0,state.visible);
      list.innerHTML=visible.length?visible.map((x,i)=>{
        const source=x.kind==="wiki"?"Knowledgebase article":typeLabel(x.site_type),location=x.kind==="wiki"?"Saved history":(x.address_label||"Saved map entry"),excerpt=text(x.summary||"").slice(0,260);
        const tone=TONES[toneKey(x)],territory=x.kind==="site"?territoryOf(x):null;
        return `<article class="site-card learning-card nearby-feed-card" style="--tone:${tone[1]}" ${x.kind==="wiki"?`data-wiki-slug="${esc(x.slug||"")}"`:`data-slug="${esc(x.slug||"")}"`} data-result-index="${i}"><div class="learning-card-body"><div class="learning-card-meta"><span>${thumbHtml(x)}${esc(source)}</span><strong>Offline</strong></div><h2><button type="button" data-result-open="${i}">${esc(x.title||"Untitled")}</button></h2><div class="learning-card-tags">${territory?`<span class="offline-territory" style="--territory:${esc(territory.fillcolor||"#e5efe9")}">${esc(shortTerritory(territory.title))}</span>`:""}<span>${esc(location)}</span></div>${excerpt?`<p class="learning-card-excerpt">${esc(excerpt)}</p>`:""}<div class="learning-card-actions"><button class="primary" type="button" data-result-open="${i}">Open saved article</button></div></div></article>`
      }).join(""):`<article class="site-card empty-state" role="status"><span class="site-copy"><h2>No saved result found</h2><p>Try a different word or area.</p></span></article>`;
      count.textContent=`${state.filtered.length} saved`;status.textContent=state.region==="all"?`${state.sites.length} mapped places`:`${state.filtered.filter(x=>x.kind==="site").length} in this area`;more.hidden=visible.length>=state.filtered.length;more.textContent=`Show more (${state.filtered.length-visible.length} remaining)`;draw();renderSuggestions();
    }
    function openDetail(detailTitle,detailMeta,detailHtml,tone="#2f6f57"){detail.querySelector(".detail-card").style.setProperty("--tone",tone);title.textContent=detailTitle;meta.textContent=detailMeta;body.innerHTML=detailHtml;detail.hidden=false;detail.classList.add("open");detail.querySelector(".detail-card").scrollTop=0}
    function open(item){
      if(!item)return;const intro=text(item.summary||""),why=text(item.why_this_matters||""),tone=TONES[toneKey(item)],territory=item.kind==="site"?territoryOf(item):null;openDetail(item.title||"Saved article",item.kind==="wiki"?"Knowledgebase article":(item.address_label||item.site_type||"Mapped place"),`<p class="detail-kind">${thumbHtml(item)}${esc(tone[0])}${territory?` <span class="offline-territory" style="--territory:${esc(territory.fillcolor||"#e5efe9")}">${esc(shortTerritory(territory.title))}</span>`:""}</p>${intro?`<p>${esc(intro)}</p>`:"<p>No summary was saved for this entry.</p>"}${why?`<h3>Why this matters</h3><p>${esc(why)}</p>`:""}<p class="offline-only">This saved version remains available without a connection. Images, comments, accounts, submissions, and current updates return when the app reconnects.</p>`,tone[1]);
    }
    function showMap(){app.classList.remove("panel-maximized");app.classList.add("panel-collapsed");mapTab.setAttribute("aria-pressed","true");savedTab.setAttribute("aria-pressed","false");collapse.textContent="Open";full.textContent="Full";full.setAttribute("aria-expanded","false");setTimeout(draw,60)}
    function showArchive({maximize=false,focusSearch=false}={}){app.classList.remove("panel-collapsed");app.classList.toggle("panel-maximized",maximize);mapTab.setAttribute("aria-pressed","false");savedTab.setAttribute("aria-pressed","true");collapse.textContent="Collapse";full.textContent=maximize?"Restore":"Full";full.setAttribute("aria-expanded",maximize?"true":"false");if(focusSearch)setTimeout(()=>search.focus({preventScroll:true}),80);setTimeout(draw,60)}
    async function start(){
      try{
        const [sitePayload,centerPayload,wikiPayload]=await Promise.all(PATHS.map(load)),archive=OFFLINE.prepareArchive(sitePayload,centerPayload,wikiPayload,{searchUtils:SEARCH,regionBoundaries:S});
        state.sites=archive.sites;state.wikis=archive.wikis;state.entries=archive.entries;state.queryCache.clear();summary.textContent=`Offline archive: ${state.sites.length} listings and ${state.wikis.length} wiki articles saved. Tap a pin or search below.`;render();
      }catch(error){summary.textContent="The saved archive could not be opened. Reconnect and reopen the app to refresh its offline copy.";status.textContent="Offline archive unavailable";list.innerHTML=`<article class="site-card empty-state" role="status"><span class="site-copy"><h2>Saved content could not load</h2><p>${esc(error?.message||"Unknown offline error")}</p></span></article>`}
    }
    const submitSearch=()=>{state.query=search.value.trim();state.visible=LIMIT;showArchive({maximize:true});render();hideSuggestions();search.blur()};
    search.addEventListener("input",()=>{state.query=search.value.trim();state.visible=LIMIT;showArchive();render()});search.addEventListener("focus",renderSuggestions);search.addEventListener("search",submitSearch);search.addEventListener("keydown",event=>{if(event.key==="Enter"){event.preventDefault();submitSearch()}else if(event.key==="Escape")hideSuggestions()});
    suggestions.addEventListener("pointerdown",event=>event.preventDefault());suggestions.addEventListener("click",event=>{const button=event.target.closest("[data-offline-search-suggestion]");if(!button)return;const item=state.filtered[Number(button.dataset.offlineSearchSuggestion)];if(!item)return;search.value=item.title||"";state.query=search.value;state.visible=LIMIT;render();hideSuggestions();search.focus()});
    document.querySelectorAll("[data-offline-jump]").forEach(button=>button.addEventListener("click",()=>{
      button.dataset.offlineJump==="map"?showMap():showArchive({focusSearch:button.closest("#offline-menu")!==null});button.closest("details")?.removeAttribute("open");
    }));
    document.querySelectorAll("[data-offline-region]").forEach(b=>b.addEventListener("click",()=>{state.region=b.dataset.offlineRegion||"all";state.visible=LIMIT;document.querySelectorAll("[data-offline-region]").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));$("offline-region-menu").removeAttribute("open");showArchive();render()}));
    list.addEventListener("click",e=>{const b=e.target.closest("[data-result-index]");if(b)open(state.filtered[Number(b.dataset.resultIndex)])});
    more.addEventListener("click",()=>{state.visible+=LIMIT;render()});
    const pointers=new Map();let moved=false,pinch=0,lastTap=0;
    const local=e=>{const r=canvas.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
    canvas.style.touchAction="none";
    canvas.addEventListener("pointerdown",e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,local(e));moved=false;if(pointers.size===2){const [a,b]=[...pointers.values()];pinch=Math.hypot(a[0]-b[0],a[1]-b[1])}});
    canvas.addEventListener("pointermove",e=>{if(!pointers.has(e.pointerId))return;const prev=pointers.get(e.pointerId),now=local(e);pointers.set(e.pointerId,now);
      if(pointers.size===2){const [a,b]=[...pointers.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch)zoomAt((a[0]+b[0])/2,(a[1]+b[1])/2,d/pinch);pinch=d;moved=true;return}
      if(view.scale>1&&Math.hypot(now[0]-prev[0],now[1]-prev[1])>0.5){view.x+=now[0]-prev[0];view.y+=now[1]-prev[1];moved=true;requestAnimationFrame(draw)}});
    const release=e=>{pointers.delete(e.pointerId);if(pointers.size<2)pinch=0};
    canvas.addEventListener("pointerup",e=>{const [x,y]=local(e),wasPinch=pointers.size>1;release(e);if(moved||wasPinch)return;
      const t=Date.now();if(t-lastTap<300){lastTap=0;zoomAt(x,y,2);return}lastTap=t;
      const n=state.points.map(p=>({...p,d:Math.hypot(p.x-x,p.y-y)})).sort((a,b)=>a.d-b.d)[0];if(n&&n.d<=22)setTimeout(()=>{if(lastTap===t)open(n.item)},260)});
    canvas.addEventListener("pointercancel",release);
    canvas.addEventListener("wheel",e=>{e.preventDefault();const [x,y]=local(e);zoomAt(x,y,e.deltaY<0?1.25:0.8)},{passive:false});
    collapse.addEventListener("click",()=>app.classList.contains("panel-collapsed")?showArchive():showMap());full.addEventListener("click",()=>showArchive({maximize:!app.classList.contains("panel-maximized")}));
    $("offline-about").addEventListener("click",()=>openDetail("About On This Site","Native Long Island",'<p>On This Site is a map-based archive for learning about Native Long Island places, histories, and continuing community presence.</p><p class="offline-only">You are viewing the saved offline archive.</p>'));$("offline-menu-about").addEventListener("click",()=>{$("offline-menu").removeAttribute("open");$("offline-about").click()});
    $("offline-feedback").addEventListener("click",()=>openDetail("Feedback","Connection required",'<p>Feedback, comments, site suggestions, and contributions will be available after the app reconnects.</p><p class="offline-only">Your saved map and articles remain available now.</p>'));$("offline-menu-help").addEventListener("click",()=>{$("offline-menu").removeAttribute("open");$("offline-feedback").click()});
    document.querySelectorAll(".quick-actions details").forEach(menu=>menu.addEventListener("toggle",()=>{if(menu.open)document.querySelectorAll(".quick-actions details").forEach(other=>{if(other!==menu)other.removeAttribute("open")})}));
    const closeDetail=()=>{detail.classList.remove("open");detail.hidden=true};detail.querySelector(".detail-close").addEventListener("click",closeDetail);detail.addEventListener("click",e=>{if(e.target===detail)closeDetail()});addEventListener("resize",draw,{passive:true});
    window.onAndroidBackPressed=()=>{if(!suggestions.hidden){hideSuggestions();return true}const menu=document.querySelector(".mobile-more-menu[open]");if(menu){menu.removeAttribute("open");return true}const areas=document.querySelector(".mobile-layer-menu[open]");if(areas){areas.removeAttribute("open");return true}if(!detail.hidden){closeDetail();return true}if(!app.classList.contains("panel-collapsed")){showMap();return true}return false};
    $("offline-legend").innerHTML=["placename","landmark","deed","burial","activism","water"].map(k=>`<span><i style="--tone:${TONES[k][1]}"></i>${TONES[k][0]}</span>`).join("");
    window.NLI_APK_OFFLINE_TEXT_MODE=true;start().then(loadDecor);
  })();
  </script>

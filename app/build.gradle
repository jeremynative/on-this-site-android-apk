plugins {
    id "com.android.application"
}

configurations {
    googleNavigationLegal
}

dependencies {
    implementation "com.android.billingclient:billing:8.2.1"
    // Google Navigation SDK 7.6 is the newest line compatible with the
    // project's Gradle 8.11 / Android Gradle Plugin 8.10 toolchain.
    implementation "com.google.android.libraries.navigation:navigation:7.6.0"
    googleNavigationLegal "com.google.android.libraries.navigation:navigation:7.6.0@aar"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs_nio:2.0.3"
    // Keep the native map available on devices without Vulkan. MapLibre 13's
    // default artifact requires Vulkan, while the OpenGL artifact uses the
    // same Android API with the widest supported-device coverage.
    implementation "org.maplibre.gl:android-sdk-opengl:13.5.0"
}

def releaseKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def hasReleaseSigning = releaseKeystorePath
    && System.getenv("ANDROID_KEYSTORE_PASSWORD")
    && System.getenv("ANDROID_KEY_ALIAS")
    && System.getenv("ANDROID_KEY_PASSWORD")
def releaseNativeAbis = (System.getenv("RELEASE_ABIS") ?: "arm64-v8a,armeabi-v7a")
    .split(",")
    .collect { it.trim() }
    .findAll { it }

android {
    namespace = "com.nativelongisland.onthissite"
    compileSdk = 36
    buildToolsVersion = "35.0.0"

    buildFeatures {
        buildConfig = true
    }

    androidResources {
        // MapLibre reads PMTiles by byte range. Keeping these archives
        // uncompressed inside the APK makes asset:// random access reliable.
        noCompress += ["pmtiles"]
        // Keep source snapshots available for parity verification without
        // shipping duplicate self-contained shells or desktop-only map files.
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:mobile-app.html:mobile-app-live-bundled.html:long-island-land-mask.geojson:native-long-island-map.js"
    }

    defaultConfig {
        applicationId = "com.nativelongisland.onthissite"
        minSdk = 24
        targetSdk = 36
        versionCode = Integer.parseInt((System.getenv("VERSION_CODE") ?: "17").toString())
        versionName = (System.getenv("VERSION_NAME") ?: "0.1.16").toString()
        buildConfigField "String", "MAPBOX_TOKEN", "\"${(System.getenv("MAPBOX_TOKEN") ?: "").replace("\\", "\\\\").replace("\"", "\\\"")}\""
        buildConfigField "String", "GOOGLE_NAVIGATION_API_KEY", "\"${(System.getenv("GOOGLE_NAVIGATION_API_KEY") ?: "").replace("\\", "\\\\").replace("\"", "\\\"")}\""
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile = file(releaseKeystorePath)
                storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix = ".qa"
            versionNameSuffix = "-qa"
            // Keep emulator architectures in QA builds so local Android
            // emulators remain useful for regression testing.
            ndk {
                abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
            }
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            // Obtainium receives one compact universal ARM APK. CI overrides
            // RELEASE_ABIS for the Play AAB so Google can continue serving
            // x86/x86_64 devices through per-device bundle splits.
            ndk {
                abiFilters.addAll(releaseNativeAbis)
            }
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
        }
        optimizedQa {
            initWith release
            applicationIdSuffix = ".qa"
            versionNameSuffix = "-optimized-qa"
            signingConfig = signingConfigs.debug
            debuggable = false
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets.main.assets.srcDir(layout.buildDirectory.dir("generated/google-navigation-legal"))
}

tasks.register("prepareGoogleNavigationLegal", Copy) {
    from { configurations.googleNavigationLegal.collect { zipTree(it) } }
    include "LICENSE"
    rename { "google-navigation-licenses.txt" }
    into layout.buildDirectory.dir("generated/google-navigation-legal")
}

tasks.named("preBuild").configure {
    dependsOn tasks.named("prepareGoogleNavigationLegal")
}

gradle.taskGraph.whenReady { graph ->
    if ((graph.hasTask(":app:assembleRelease") || graph.hasTask(":app:bundleRelease")) && !hasReleaseSigning) {
        throw new GradleException("Release APK builds require ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD so Obtainium updates keep the same signing certificate.")
    }
}


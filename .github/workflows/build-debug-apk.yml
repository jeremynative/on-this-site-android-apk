name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DRIVE_LATEST_FOLDER_ID: "1sfAI_MWpH91EVnAo2Q_bWUR-wQG8Gw1M"
  DRIVE_OLD_FOLDER_ID: "12NPUpGl044BtywC0FWV9igPsCFHTDuDZ"
  GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK files
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/on-this-site-latest-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "release/on-this-site-debug-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}.apk"

      - name: Upload APK to GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: on-this-site-debug-apk
          path: release/*.apk

      - name: Install rclone for Google Drive archive
        if: env.GDRIVE_SERVICE_ACCOUNT_JSON != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Archive latest APK to Google Drive
        if: env.GDRIVE_SERVICE_ACCOUNT_JSON != ''
        run: |
          set -euo pipefail
          printf '%s' "$GDRIVE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/gdrive-service-account.json"
          rclone config create gdrive_latest drive service_account_file "$RUNNER_TEMP/gdrive-service-account.json" root_folder_id "$DRIVE_LATEST_FOLDER_ID" >/dev/null
          rclone config create gdrive_old drive service_account_file "$RUNNER_TEMP/gdrive-service-account.json" root_folder_id "$DRIVE_OLD_FOLDER_ID" >/dev/null
          archive_name="on-this-site-debug-previous-before-run-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}.apk"
          rclone copyto gdrive_latest:on-this-site-latest-debug.apk "gdrive_old:${archive_name}" || true
          rclone copyto release/on-this-site-latest-debug.apk gdrive_latest:on-this-site-latest-debug.apk

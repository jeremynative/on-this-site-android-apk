name: Build Android APK and Play Bundle

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  DRIVE_LATEST_FOLDER_ID: "1sfAI_MWpH91EVnAo2Q_bWUR-wQG8Gw1M"
  DRIVE_OLD_FOLDER_ID: "12NPUpGl044BtywC0FWV9igPsCFHTDuDZ"
  GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Android app shell
        run: node verify-app-shell.js

      - name: Verify Google Play readiness
        run: node verify-google-play-readiness.js

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Resolve APK version
        id: apk_version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_apk="$(gh release list --limit 100 --json tagName --jq '[.[].tagName | select(test("^apk-[0-9]+$")) | sub("^apk-";"") | tonumber] | max // 102')"
          run_number="${GITHUB_RUN_NUMBER:-0}"
          version_code="$run_number"
          if ! [[ "$version_code" =~ ^[0-9]+$ ]] || [[ "$version_code" -le "$latest_apk" ]]; then
            version_code=$((latest_apk + 1))
          fi
          echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"
          echo "version_name=0.1.${version_code}" >> "$GITHUB_OUTPUT"
          echo "release_tag=apk-${version_code}" >> "$GITHUB_OUTPUT"

      - name: Decode release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/on-this-site-release.jks"

      - name: Build signed release APK and Play Bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/on-this-site-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ steps.apk_version.outputs.version_code }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.apk_version.outputs.version_name }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          if [[ -z "${MAPBOX_TOKEN:-}" ]]; then
            live_html="$(curl -fsSL 'https://nativelongisland.com/mobile-app-live.html' || true)"
            MAPBOX_TOKEN="$(printf '%s' "$live_html" | grep -oE 'pk\.ey[A-Za-z0-9._-]+' | head -n 1 || true)"
            export MAPBOX_TOKEN
          fi
          if [[ -z "${MAPBOX_TOKEN:-}" ]]; then
            previous_dir="$RUNNER_TEMP/previous-apk"
            mkdir -p "$previous_dir"
            gh release download --pattern 'on-this-site-latest.apk' --dir "$previous_dir" --clobber || true
            previous_apk="$(find "$previous_dir" -name 'on-this-site-latest.apk' -print -quit)"
            if [[ -n "$previous_apk" && -f "$previous_apk" ]]; then
              MAPBOX_TOKEN="$(APK_PATH="$previous_apk" python3 -c 'import os,re,zipfile; p=os.environ.get("APK_PATH",""); pat=re.compile(rb"pk\.ey[A-Za-z0-9._-]+"); out=""; z=zipfile.ZipFile(p); [print(m.group(0).decode("ascii")) or exit(0) for n in z.namelist() if (n.endswith(".dex") or n.endswith(".html") or n.endswith(".js")) for m in [pat.search(z.read(n))] if m]')"
              export MAPBOX_TOKEN
            fi
          fi
          test -n "$MAPBOX_TOKEN"
          if [[ ! "$MAPBOX_TOKEN" =~ ^pk\.ey ]]; then
            echo "MAPBOX_TOKEN must be a public pk token for APK builds."
            exit 1
          fi
          echo "::add-mask::$MAPBOX_TOKEN"
          gradle lintRelease assembleRelease bundleRelease --no-daemon

      - name: Verify native ABI and 16 KB page-size compatibility
        run: |
          set -euo pipefail
          apk_native_root="$RUNNER_TEMP/apk-native-audit"
          mkdir -p "$apk_native_root"
          unzip -q app/build/outputs/apk/release/app-release.apk 'lib/*/*.so' -d "$apk_native_root"
          node verify-native-library-compat.js "$apk_native_root/lib" --expected=arm64-v8a,armeabi-v7a
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/release/app-release.apk
          aab_native_root="$RUNNER_TEMP/aab-native-audit"
          mkdir -p "$aab_native_root"
          unzip -q app/build/outputs/bundle/release/app-release.aab 'base/lib/*/*.so' -d "$aab_native_root"
          node verify-native-library-compat.js "$aab_native_root/base/lib" --expected=arm64-v8a,armeabi-v7a

      - name: Prepare release APK files
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/on-this-site-latest.apk

      - name: Upload APK to GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: on-this-site-latest-apk
          path: release/*.apk

      - name: Upload Play Bundle to GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: on-this-site-play-bundle
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Publish Obtainium testing release APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.apk_version.outputs.release_tag }}
          name: On This Site Android ${{ steps.apk_version.outputs.version_name }}
          body: |
            APK for testing the On This Site Android wrapper through Obtainium.

            Most map, content, UI, and data updates load from the live mobile site and do not require reinstalling the APK. Reinstall this only after native Android wrapper changes such as permissions, WebView behavior, or app packaging.
          artifacts: "release/on-this-site-latest.apk"
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          prerelease: false
          makeLatest: true

      - name: Publish Obtainium release APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: On This Site ${{ github.ref_name }}
          body: |
            Signed release APK for On This Site Android.

            Add this repository to Obtainium to receive APK update notices from GitHub Releases:
            https://github.com/jeremynative/on-this-site-android-apk
          artifacts: "release/on-this-site-latest.apk"
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          makeLatest: true

      - name: Install rclone for Google Drive archive
        if: env.GDRIVE_SERVICE_ACCOUNT_JSON != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Archive latest APK to Google Drive
        if: env.GDRIVE_SERVICE_ACCOUNT_JSON != ''
        run: |
          set -euo pipefail
          printf '%s' "$GDRIVE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/gdrive-service-account.json"
          rclone config create gdrive_latest drive service_account_file "$RUNNER_TEMP/gdrive-service-account.json" root_folder_id "$DRIVE_LATEST_FOLDER_ID" >/dev/null
          rclone config create gdrive_old drive service_account_file "$RUNNER_TEMP/gdrive-service-account.json" root_folder_id "$DRIVE_OLD_FOLDER_ID" >/dev/null
          latest_name="on-this-site-latest.apk"
          archive_name="on-this-site-previous-before-run-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}.apk"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            archive_name="on-this-site-previous-before-${GITHUB_REF_NAME}.apk"
          fi
          rclone copyto "gdrive_latest:${latest_name}" "gdrive_old:${archive_name}" || true
          rclone copyto "release/${latest_name}" "gdrive_latest:${latest_name}"
